<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTraffic - Log in</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #283040;
    --text: #d7dee8; --muted: #8b98ab; --accent: #58a6ff; --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; }
  form {
    width: 100%; max-width: 340px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 24px;
  }
  h1 { margin: 0 0 4px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  p { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
  input {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px; font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    width: 100%; margin-top: 18px; padding: 9px; border-radius: 6px; border: 0;
    background: var(--accent); color: #04101f; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  #error { color: var(--err); font-size: 12px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<form id="login" autocomplete="on">
  <h1>OpenTraffic</h1>
  <p>Log in to this unit's inspector.</p>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" value="operator" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button id="submit" type="submit">Log in</button>
  <div id="error" role="alert"></div>
</form>
<script>
"use strict";
document.getElementById("login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const button = document.getElementById("submit");
  const error = document.getElementById("error");
  button.disabled = true;
  error.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    if (res.ok) {
      window.location.href = "/";
      return;
    }
    const body = await res.json().catch(() => ({}));
    error.textContent = body.error || `Login failed (HTTP ${res.status})`;
  } catch (err) {
    error.textContent = "Cannot reach the unit.";
  }
  button.disabled = false;
});
</script>
</body>
</html>
